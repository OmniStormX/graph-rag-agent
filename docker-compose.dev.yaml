services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        INSTALL_LOCAL_NLP: ${INSTALL_LOCAL_NLP:-false}
    environment:
      SERVER_WORKERS: 1
      FASTAPI_WORKERS: 1
    volumes:
      # 开发模式直接挂载源码，避免每次改动都重建镜像。
      - ./graphrag_agent:/app/graphrag_agent
      - ./server:/app/server
      - ./frontend:/app/frontend
      - ./assets:/app/assets
      - ./docker:/app/docker
      - ./tool_services:/app/tool_services
      - ./readme.md:/app/readme.md

  fluid-property-service:
    volumes:
      # 开发模式下同步挂载工具服务源码，便于快速验证 MCP 接口。
      - ./tool_services:/app/tool_services
