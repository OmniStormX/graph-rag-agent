name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - graphRAG-CSU
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支的新提交会取消旧流水线，避免 CI 资源堆积。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ubuntu Smoke Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      LANGFUSE_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # 这组 smoke test 只要求模块可导入，不依赖真实 Neo4j 连通性。
      NEO4J_URI: "bolt://127.0.0.1:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "test-password"
      NEO4J_MAX_POOL_SIZE: "10"
      NEO4J_REFRESH_SCHEMA: "false"
      GRAPH_ADMIN_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.local_nlp.txt
            setup.py

      - name: Install Ubuntu system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            antiword \
            poppler-utils \
            unrtf \
            libmagic1 \
            libxml2 \
            libxslt1.1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .

      - name: Run syntax smoke check
        run: |
          python -m compileall \
            graphrag_agent \
            server \
            frontend \
            tool_services

      - name: Run stable unittest suite
        run: |
          python -m unittest -v \
            test.test_vector_index_utils \
            test.test_fluid_property_tool \
            test.test_fluid_property_service \
            test.test_mcp_tool_discovery \
            test.test_stream_integration \
            test.test_agent_tool_call_sanitization \
            test.test_observability
