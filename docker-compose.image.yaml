services:
  # 初始化容器：仅针对 bind mount 目录执行顶层 chown，
  # 确保宿主机自动创建（默认 root:root）的目录对容器内 appuser (UID=1000) 可写。
  # 不使用 -R 避免 WSL/Docker 在递归修改属主时出现挂载快照竞争，导致主容器看不到文件。
  # 执行完即退出，app 服务通过 depends_on.service_completed_successfully 等待其完成。
  app-init:
    image: busybox:1.36
    container_name: graph-rag-app-init
    command: >
      sh -c "chown 1000:1000 /mnt/files /mnt/datasets /mnt/documents &&
             echo '[app-init] bind mount 目录属主已修正为 1000:1000'"
    volumes:
      - ./files:/mnt/files
      - ./datasets:/mnt/datasets
      - ./documents:/mnt/documents
    restart: "no"

  app:
    image: ${GRAPH_RAG_IMAGE:-ghcr.io/omnistormx/graph-rag-app:graphRAG-CSU}
    container_name: graph-rag-app
    env_file:
      - .env
    environment:
      # 容器网络内统一使用服务名访问依赖，避免宿主机 localhost 语义不一致。
      NEO4J_URI: neo4j://neo4j:7687
      GRAPH_ADMIN_METADATA_DSN: postgresql://postgres:postgres@postgres:5432/graphrag_admin
      FRONTEND_API_URL: http://127.0.0.1:8000
      ADMIN_FRONTEND_API_URL: http://127.0.0.1:8000
      MCP_TOOL_ENDPOINTS: ${MCP_TOOL_ENDPOINTS:-http://fluid-property-service:8010}
      FLUID_PROPERTY_SERVICE_URL: ${FLUID_PROPERTY_SERVICE_URL:-http://fluid-property-service:8010}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      SERVER_WORKERS: ${SERVER_WORKERS:-1}
      FASTAPI_WORKERS: ${FASTAPI_WORKERS:-1}
    ports:
      - "8000:8000"
      - "8501:8501"
      - "8502:8502"
    volumes:
      # 缓存与运行时目录改为 named volume：由 Docker 管理属主，
      # 避免 WSL / Windows 文件系统下 bind mount 的属主和性能问题。
      # 如需查看/清理：docker volume inspect graph_rag_cache
      - graph_rag_cache:/app/cache
      - graph_rag_runtime:/app/runtime
      # 用户上传与语料目录保留 bind mount，便于宿主机直接放置/备份文件。
      - ./files:/app/files
      - ./datasets:/app/datasets
      - ./documents:/app/documents
    depends_on:
      app-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      fluid-property-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/docker/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  fluid-property-service:
    image: ${GRAPH_RAG_IMAGE:-ghcr.io/omnistormx/graph-rag-app:graphRAG-CSU}
    container_name: graph-rag-fluid-property-service
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/server:/app/frontend
    command:
      - python
      - -m
      - uvicorn
      - tool_services.fluid_property_service.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: graphrag_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graphrag_admin"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5.22.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/12345678"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: "2G"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "1G"
      NEO4J_apoc_trigger_enabled: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    restart: unless-stopped

volumes:
  # 由 Docker 管理，属主自动匹配镜像的 appuser，无需手动 chown
  graph_rag_cache:
  graph_rag_runtime:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  postgres_data:
